name: Exact-source Windows ARM64 validation
'on':
  push:
    branches:
    - hermes-ci/windows-arm64-07012ea399b9
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-cp312:
    strategy:
      matrix:
        ARCH:
        - NAME: arm64
          RUNNER: windows-11-arm
          VCVARS: vcvarsarm64.bat
          PLAT_NAME: win_arm64
          PACKAGING_DRIVE: 'C:'
          BUILD_ARGS: --onetbb
          TIMEOUT: 90
        PYTHON:
        - VERSION_SPEC: '3.12'
          ARM64_VERSION_SPEC: '3.12'
          TAG: cp312
    runs-on: ${{ matrix.ARCH.RUNNER }}
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      PACKAGING_DIR: ${{ matrix.ARCH.PACKAGING_DRIVE }}\packaging
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: nithin-aashik-mcw/OpenUSD
        ref: 07012ea399b9c76509f5d2fea193eb6c599cea3f
        persist-credentials: false
    - name: Verify exact public PR source SHA
      shell: pwsh
      env:
        EXPECTED_SOURCE_SHA: 07012ea399b9c76509f5d2fea193eb6c599cea3f
        SOURCE_REPOSITORY: nithin-aashik-mcw/OpenUSD
      run: |
        $actual = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Unexpected source revision: $actual" }
        @{ source_sha=$actual; source_repository=$env:SOURCE_REPOSITORY; ci_sha=$env:GITHUB_SHA; runner_arch=$env:RUNNER_ARCH } | ConvertTo-Json | Set-Content provenance.json
    - name: Install Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.ARCH.NAME == 'arm64' && matrix.PYTHON.ARM64_VERSION_SPEC || matrix.PYTHON.VERSION_SPEC
          }}
        architecture: ${{ matrix.ARCH.NAME }}
        check-latest: false
    - name: Install dependencies
      run: |
        python -m pip install setuptools
        python -m pip install wheel
      shell: cmd
    - name: Build USD
      run: |
        :: Locate Visual Studio with vswhere since the install path differs between runner images
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS_INSTALL_DIR=%%i
        call "%VS_INSTALL_DIR%\VC\Auxiliary\Build\${{ matrix.ARCH.VCVARS }}" || exit /b 1
        set BOOST_ROOT=
        python --version
        python build_scripts/build_usd.py ${{ matrix.ARCH.BUILD_ARGS }} --build-monolithic --build-args USD,"-DPXR_ENABLE_PRECOMPILED_HEADERS=OFF -DPXR_PY_UNDEFINED_DYNAMIC_LOOKUP=ON -DPXR_BUILD_USD_TOOLS=OFF -DPXR_BUILD_EXEC=OFF -DPXR_INSTALL_LOCATION=../pxr/pluginfo -DPXR_PYTHON_INSTALL_DIR=lib/python" --no-materialx --no-imaging --no-examples --no-tutorials --build USDgen/build --src USDgen/src USDinst -v
      shell: cmd
    - name: Packaging USD
      run: |
        dir
        mkdir %PACKAGING_DIR%
        xcopy /E /I USDinst %PACKAGING_DIR%\inst
        copy build_scripts\pypi\package_files\* %PACKAGING_DIR%
        copy LICENSE.txt %PACKAGING_DIR%
        dir %PACKAGING_DIR%
        dir %PACKAGING_DIR%\inst
      shell: cmd
    - name: Running setup.py
      run: |
        cd /d %PACKAGING_DIR%
        python setup.py ${{ env.POST_RELEASE_TAG }} bdist_wheel --python-tag ${{ matrix.PYTHON.TAG }} --plat-name ${{ matrix.ARCH.PLAT_NAME }}
        dir
      shell: cmd
    - name: Verify native Python, wheel PE payloads and RECORD
      shell: python
      run: |
        import base64,csv,hashlib,io,json,pathlib,struct,sys,sysconfig,zipfile
        assert sysconfig.get_platform() == 'win-arm64', sysconfig.get_platform()
        def machine(b):
            assert b[:2] == b'MZ'
            p=struct.unpack_from('<I', b, 0x3c)[0]
            assert b[p:p+4] == b'PE\0\0'
            return struct.unpack_from('<H',b,p+4)[0]
        assert machine(pathlib.Path(sys.executable).read_bytes()) == 0xaa64
        roots=[r'C:\packaging\dist']
        wheels=sorted({p for r in roots for p in pathlib.Path(r).glob('*.whl')})
        assert wheels, roots
        result=[]
        for path in wheels:
            assert 'win_arm64' in path.name, path.name
            with zipfile.ZipFile(path) as z:
                records=[n for n in z.namelist() if n.endswith('.dist-info/RECORD')]
                assert len(records)==1
                count=0
                for n,h,size in csv.reader(io.StringIO(z.read(records[0]).decode())):
                    if h:
                        alg,want=h.split('=',1)
                        b=z.read(n)
                        assert base64.urlsafe_b64encode(hashlib.new(alg,b).digest()).rstrip(b'=').decode()==want,n
                        assert len(b)==int(size),n
                        count+=1
                natives={n:hex(machine(z.read(n))) for n in z.namelist() if n.lower().endswith(('.pyd','.dll'))}
                assert natives and all(x=='0xaa64' for x in natives.values()),natives
                result.append({'wheel':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'record_verified':count,'native':natives})
        pathlib.Path('wheel-audit.json').write_text(json.dumps(result,indent=2))
        print(json.dumps(result,indent=2))
    - name: Install wheel and run upstream packaging tests
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        python -m venv wheel-test
        if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
        $py = Join-Path $PWD 'wheel-test/Scripts/python.exe'
        & $py -m pip install pytest
        if ($LASTEXITCODE -ne 0) { throw 'test tools failed' }
        $wheels = @(Get-ChildItem "$env:PACKAGING_DIR/dist/*.whl")
        if ($wheels.Count -ne 1) { throw 'Expected one wheel' }
        & $py -m pip install $wheels[0].FullName
        if ($LASTEXITCODE -ne 0) { throw 'wheel installation failed' }
        & $py -m pytest --junitxml=TEST-usdinstall.xml build_scripts/pypi/test.py
        if ($LASTEXITCODE -ne 0) { throw 'upstream packaging tests failed' }
        & $py -c "from pxr import Usd, UsdGeom; s=Usd.Stage.CreateInMemory(); p=UsdGeom.Sphere.Define(s, '/sphere'); p.GetRadiusAttr().Set(2.5); text=s.GetRootLayer().ExportToString(); t=Usd.Stage.CreateInMemory(); assert t.GetRootLayer().ImportFromString(text); assert UsdGeom.Sphere.Get(t,'/sphere').GetRadiusAttr().Get()==2.5; print('stage roundtrip passed', Usd.GetVersion())"
        if ($LASTEXITCODE -ne 0) { throw 'stage roundtrip failed' }
    - name: Stage evidence under one absolute upload root
      if: ${{ always() }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $stage = Join-Path $env:RUNNER_TEMP 'native-evidence'
        New-Item -ItemType Directory -Force $stage | Out-Null
        "EVIDENCE_ROOT=$stage" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        $manifest = @()
        $dest = Join-Path $stage 'wheel'
        New-Item -ItemType Directory -Force $dest | Out-Null
        $files = @(Get-ChildItem -Path "$env:PACKAGING_DIR/dist/*.whl" -File  -ErrorAction SilentlyContinue)
        foreach ($file in $files) {
          $target = Join-Path $dest $file.Name
          if (Test-Path $target) { $target = Join-Path $dest (($manifest.Count.ToString()) + "-" + $file.Name) }
          Copy-Item -LiteralPath $file.FullName -Destination $target
          $manifest += @{source=$file.FullName; staged=$target; sha256=(Get-FileHash -Algorithm SHA256 $target).Hash}
        }
        $dest = Join-Path $stage 'metadata'
        New-Item -ItemType Directory -Force $dest | Out-Null
        $files = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE/provenance.json" -File  -ErrorAction SilentlyContinue)
        foreach ($file in $files) {
          $target = Join-Path $dest $file.Name
          if (Test-Path $target) { $target = Join-Path $dest (($manifest.Count.ToString()) + "-" + $file.Name) }
          Copy-Item -LiteralPath $file.FullName -Destination $target
          $manifest += @{source=$file.FullName; staged=$target; sha256=(Get-FileHash -Algorithm SHA256 $target).Hash}
        }
        $dest = Join-Path $stage 'metadata'
        New-Item -ItemType Directory -Force $dest | Out-Null
        $files = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE/wheel-audit.json" -File  -ErrorAction SilentlyContinue)
        foreach ($file in $files) {
          $target = Join-Path $dest $file.Name
          if (Test-Path $target) { $target = Join-Path $dest (($manifest.Count.ToString()) + "-" + $file.Name) }
          Copy-Item -LiteralPath $file.FullName -Destination $target
          $manifest += @{source=$file.FullName; staged=$target; sha256=(Get-FileHash -Algorithm SHA256 $target).Hash}
        }
        $dest = Join-Path $stage 'tests'
        New-Item -ItemType Directory -Force $dest | Out-Null
        $files = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE/TEST-usdinstall.xml" -File  -ErrorAction SilentlyContinue)
        foreach ($file in $files) {
          $target = Join-Path $dest $file.Name
          if (Test-Path $target) { $target = Join-Path $dest (($manifest.Count.ToString()) + "-" + $file.Name) }
          Copy-Item -LiteralPath $file.FullName -Destination $target
          $manifest += @{source=$file.FullName; staged=$target; sha256=(Get-FileHash -Algorithm SHA256 $target).Hash}
        }
        $dest = Join-Path $stage 'logs'
        New-Item -ItemType Directory -Force $dest | Out-Null
        $files = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE/USDgen/build/*/log.txt" -File -Recurse -ErrorAction SilentlyContinue)
        foreach ($file in $files) {
          $target = Join-Path $dest $file.Name
          if (Test-Path $target) { $target = Join-Path $dest (($manifest.Count.ToString()) + "-" + $file.Name) }
          Copy-Item -LiteralPath $file.FullName -Destination $target
          $manifest += @{source=$file.FullName; staged=$target; sha256=(Get-FileHash -Algorithm SHA256 $target).Hash}
        }
        $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $stage "staging-manifest.json")
        Get-ChildItem -LiteralPath $stage -Recurse -File | Format-Table FullName,Length
        if ($manifest.Count -eq 0) { throw "No evidence staged" }
    - name: Require complete wheel and test evidence
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if (@(Get-ChildItem "$env:EVIDENCE_ROOT/wheel/*.whl" -File -ErrorAction SilentlyContinue).Count -eq 0) { throw "Missing required evidence: wheel/*.whl" }
        if (@(Get-ChildItem "$env:EVIDENCE_ROOT/metadata/provenance.json" -File -ErrorAction SilentlyContinue).Count -eq 0) { throw "Missing required evidence: metadata/provenance.json" }
        if (@(Get-ChildItem "$env:EVIDENCE_ROOT/metadata/wheel-audit.json" -File -ErrorAction SilentlyContinue).Count -eq 0) { throw "Missing required evidence: metadata/wheel-audit.json" }
        if (@(Get-ChildItem "$env:EVIDENCE_ROOT/tests/TEST-usdinstall.xml" -File -ErrorAction SilentlyContinue).Count -eq 0) { throw "Missing required evidence: tests/TEST-usdinstall.xml" }
    - name: Upload usd-cp312-native-evidence
      uses: actions/upload-artifact@v4
      with:
        name: usd-cp312-native-evidence
        path: ${{ env.EVIDENCE_ROOT }}/
        if-no-files-found: error
        retention-days: 14
      if: ${{ always() }}
env:
  POST_RELEASE_TAG: ' '
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
